{% extends "layout.html" %}

{% block body %}
<h2>Explain Unit</h2>

<!-- Unit Selector -->
<div class="mb-3">
  <label for="unit-select" class="form-label">Select Unit:</label>
  <select id="unit-select" class="form-select" onchange="onUnitChange()">
    {% for u in units %}
      <option value="{{ u }}" {% if u == unit %}selected{% endif %}>Unit {{ u }}</option>
    {% endfor %}
  </select>
</div>

<!-- SHAP Bar Chart -->
<div id="shap-bar" style="height:400px;"></div>

<!-- Force Plot Button & Modal -->
<button class="btn btn-secondary" data-bs-toggle="modal" data-bs-target="#forceModal">Force Plot</button>
<div class="modal fade" id="forceModal" tabindex="-1">
  <div class="modal-dialog modal-xl">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">SHAP Force Plot</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body" id="force-plot"></div>
    </div>
  </div>
</div>
{% endblock %}

{% block scripts %}
<!-- 1. SHAP.js 라이브러리 (필수) -->
<script src="https://cdn.jsdelivr.net/npm/shapjs@0.1.1/dist/shap.min.js"></script>

<!-- 2. 전역 변수 등록 -->
<script>
  window.SHAP_FEATURES = {{ feature_names | tojson | safe }};
  window.SHAP_VALUES   = {{ shap_values | tojson | safe }};
</script>

<!-- 3. 설명용 스크립트 로드 -->
<script src="{{ url_for('static', filename='js/explain.js') }}"></script>
{% endblock %}
