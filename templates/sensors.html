{% extends "layout.html" %}

{% block body %}
<h2>Sensor Trends & Anomalies (FD={{ fd }}, Unit={{ unit }})</h2>

<!-- ✅ FD 시나리오 선택 드롭다운 -->
<div class="mb-3">
  <label for="fd-select" class="form-label">Select FD Scenario:</label>
  <select id="fd-select" class="form-select d-inline-block w-auto me-3" onchange="onFdChange()">
    {% for i in [1,2,3,4] %}
    <option value="{{ i }}" {% if i==fd %}selected{% endif %}>FD00{{ i }}</option>
    {% endfor %}
  </select>
</div>

<!-- ✅ 유닛 선택 -->
<div class="mb-3">
  <label for="unit-select" class="form-label">Select Unit:</label>
  <select id="unit-select" class="form-select" onchange="onUnitChange()">
    {% for u in units %}
    <option value="{{ u }}" {% if u==unit %}selected{% endif %}>Unit {{ u }}</option>
    {% endfor %}
  </select>
</div>

<!-- ✅ 센서 멀티 선택 -->
<div class="row mb-3">
  <div class="col-md-6">
    <label for="sensor-select" class="form-label">Select Sensors:</label>
    <select id="sensor-select" class="form-select" multiple size="5" onchange="renderChart()">
      <!-- 옵션은 스크립트에서 동적으로 생성 -->
    </select>
  </div>
</div>

<!-- ✅ 차트 영역 -->
<div id="sensor-chart" style="height: 500px;"></div>
{% endblock %}

{% block scripts %}
<script>
  let fd   = {{ fd }};
  let unit = {{ unit }};

  function onFdChange() {
    const newFd = document.getElementById('fd-select').value;
    // 유닛은 초기값 1로 바꾸거나 유지 가능
    window.location.href = `/sensors/view?fd=${newFd}&unit=1`;
  }

  function onUnitChange() {
    const newUnit = document.getElementById('unit-select').value;
    const curFd   = document.getElementById('fd-select').value;
    window.location.href = `/sensors/view?fd=${curFd}&unit=${newUnit}`;
  }

  function renderChart() {
    const sel = document.getElementById('sensor-select');
    const selected = Array.from(sel.selectedOptions).map(o => o.value);
    const times = window.sensorData.time;
    const values = window.sensorData.values;
    const traces = selected.map(name => ({
      x: times,
      y: values[name],
      name: name,
      mode: 'lines'
    }));
    Plotly.newPlot('sensor-chart', traces, {
      title: `FD${fd} Unit ${unit} Sensor Trends`,
      xaxis: { title: 'Time' },
      yaxis: { title: 'Sensor Value' },
      height: 500
    });
  }

  // 센서 데이터 fetch + 초기화
  fetch(`/sensors?fd=${fd}&unit=${unit}`)
    .then(res => res.json())
    .then(data => {
      window.sensorData = data;
      const sel = document.getElementById('sensor-select');
      Object.keys(data.values).forEach(name => {
        const opt = document.createElement('option');
        opt.value = name;
        opt.textContent = name;
        opt.selected = true;
        sel.appendChild(opt);
      });
      renderChart();
    })
    .catch(err => {
      console.error('센서 데이터 로드 오류:', err);
      document.getElementById('sensor-chart').innerText = '데이터 로드 실패';
    });
</script>
{% endblock %}
